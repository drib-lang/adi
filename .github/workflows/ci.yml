name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest test -s
      - name: Run examples
        run: |
          export DISPLAY=:0.0
          python src/drib.py examples/fibonacci.drib
          python src/drib.py examples/bubble_sort.drib
          python src/drib.py examples/invert_image.drib
      - name: Install Drib
        run: |
          ln -sf "$PWD/bin/drib" /usr/local/bin/drib
      - name: Run examples (after install)
        run: |
          export DISPLAY=:0.0
          drib examples/fibonacci.drib
          drib examples/bubble_sort.drib
          drib examples/invert_image.drib
